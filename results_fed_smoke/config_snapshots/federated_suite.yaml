scenario: non_stationary
model: ppo_ltc_lfm
seeds:
- 7
rounds: 2
local_timesteps: 128
centralized_timesteps: 256
eval_every: 128
eval_episodes: 2
num_clients: 4
num_edges: 2
hyperparams:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 2
  minibatch_size: 32
  rollout_steps: 64
