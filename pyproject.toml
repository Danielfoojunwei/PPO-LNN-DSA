[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-benchmark"
version = "2.0.0"
description = "A seeded, capacity-matched, pre-registered benchmark for continuous-time recurrent policies in dynamic spectrum access"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Daniel Foo Jun Wei" }]

[tool.setuptools.packages.find]
include = ["dsa*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The repo root must be importable for `import dsa` to resolve. The scripts in
# scripts/ bootstrap sys.path themselves; the tests deliberately do not, so that
# they import the package the same way a consumer would. Without this, bare
# `pytest -q` fails at collection while `python -m pytest` succeeds, because
# only the latter puts the working directory on sys.path.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: exercises a training loop; excluded from the fast CI lane with -m 'not slow'",
]
filterwarnings = [
    "error::DeprecationWarning:dsa.*",
]
