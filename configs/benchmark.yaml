# Benchmark Configuration
# Replicates experimental setup from research paper

# Model architecture (both LSTM and LFM will use same hidden_dim for fair comparison)
model:
  hidden_dim: 256
  num_lfm_layers: 2
  num_lstm_layers: 2
  num_heads: 4
  use_moe: false

# PPO algorithm parameters (same for both methods)
ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  n_epochs: 10
  batch_size: 64
  update_interval: 2048

# Environment settings (matching typical paper parameters)
env:
  num_channels: 10         # Number of spectrum channels
  num_devices: 20          # Number of competing IoT devices
  seq_length: 10           # Observation sequence length
  max_steps: 100           # Max steps per episode
  interference_threshold: 0.5

# Federated learning settings
federated:
  num_clients: 20          # Total IoT clients
  num_edge_servers: 4      # Edge servers (regions)
  clients_per_edge: 5      # Clients per edge server
  num_rounds: 100          # Total training rounds
  episodes_per_round: 10   # Episodes per client per round
  aggregation_method: 'fedavg'

# Benchmark settings
benchmark:
  num_trials: 3            # Number of independent trials
  eval_episodes: 50        # Episodes for evaluation
  save_every_n_rounds: 10  # Save checkpoints frequency
  metrics_interval: 1      # How often to compute metrics

# Training settings
device: 'auto'
seed: 42
save_interval: 10
eval_interval: 5
log_interval: 1
checkpoint_dir: 'checkpoints_benchmark'
log_dir: 'logs_benchmark'
results_dir: 'results'
