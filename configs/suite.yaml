# =============================================================================
# THE CONFIRMATORY MATRIX
# =============================================================================
# This is the ONLY place the experiment matrix is declared.  No script may
# hardcode a model list, a scenario list or a seed list; they all read this file.
#
# Budget arithmetic (measured on the target box: 4 cores, CPU-only,
# torch.set_num_threads(1), num_envs=16):
#
#   sum of per-env-step core-seconds over the 7 primary models   = 76.44e-4
#   x1.25 correction for update_epochs=6 with 4 minibatches      = 95.6e-4
#   effective steps per run = 10240 train + 1024 eval            = 11264
#   cells = 5 scenarios x 12 seeds                               = 60
#   core-seconds = 60 x 95.6e-4 x 11264                          = 6461
#   wall-seconds at 4 workers with 2% contention                 = 1648 (27.5 min)
#
# `scripts/run_suite.py --dry-run` re-measures throughput against the real
# environment and refuses to start if the projection exceeds 40 minutes.
# =============================================================================

training_steps: 10240   # 10 rollout batches of num_envs(16) x horizon(64) = 1024

# Twelve seeds, not ten: statistical power over breadth.  The exact sign-flip
# test floor is 2/2^n, so n=12 reaches p=4.883e-4 and survives Holm-Bonferroni
# at alpha=0.05 in a family of up to 102 comparisons.  At n=10 the floor is
# 1.953e-3, which survives a family of only 25.  That is why the count is 12.
seeds: [7, 19, 23, 41, 89, 101, 137, 211, 307, 401, 499, 601]

# Five dynamics classes.  The previous version claimed seven, but two of them
# set the same scenario_name and differed only in a constant background-user
# count that was never mutated -- a static load sweep, not a dynamics class.
scenarios: [stationary, non_stationary, interference_heavy, irregular_dt, bursty_irregular]

# ppo_lstm is registered, capacity-matched and unit-tested but excluded here as a
# near-duplicate control of ppo_gru.  Run it with `--models ppo_lstm`.
models: [ppo_mlp, ppo_gru, ppo_transformer, ppo_ltc, ppo_cfc, ppo_cfc_dtblind, ppo_ltc_cfc]

# Zero-parameter heuristics.  These appear as rows in EVERY generated table.
baselines: [random_policy, constant_channel, greedy_heuristic]

eval_episodes: 32
num_workers: 4

ppo:
  num_envs: 16
  horizon: 64
  update_epochs: 6
  num_sequence_minibatches: 4
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5

# The CI / development budget: 2 models x 1 scenario x 2 seeds x 1024 steps.
smoke:
  training_steps: 1024
  seeds: [7, 19]
  scenarios: [stationary]
  models: [ppo_gru, ppo_cfc]
  baselines: [random_policy, constant_channel, greedy_heuristic]
  eval_episodes: 8
  num_workers: 2

# Guard rails enforced by scripts/run_suite.py --dry-run.
guard:
  max_projected_wall_minutes: 40.0
  rollout_batch: 1024          # training_steps is reduced to a multiple of this
  never_reduce_seeds: true
