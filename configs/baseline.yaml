# Configuration for single-agent baseline (no federated learning)

# Model architecture
model:
  hidden_dim: 256
  num_lfm_layers: 2
  num_heads: 4
  use_moe: false

# PPO algorithm parameters
ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  n_epochs: 10
  batch_size: 64
  update_interval: 2048

# Environment settings
env:
  num_channels: 10
  num_devices: 20
  seq_length: 10
  max_steps: 100
  interference_threshold: 0.5

# Federated learning settings (used for episode count calculation)
federated:
  num_clients: 1
  num_edge_servers: 1
  clients_per_edge: 1
  num_rounds: 100
  episodes_per_round: 10
  aggregation_method: 'fedavg'

# Training settings
device: 'auto'
seed: 42
save_interval: 10
eval_interval: 5
log_interval: 10
checkpoint_dir: 'checkpoints_baseline'
log_dir: 'logs_baseline'
