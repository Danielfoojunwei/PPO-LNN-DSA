# Stable Benchmark Configuration - Tuned to avoid NaN issues

model:
  hidden_dim: 64          # Smaller for stability
  num_lfm_layers: 1
  num_lstm_layers: 1
  num_heads: 2
  use_moe: false

ppo:
  lr: 0.0001              # Lower learning rate
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.3      # Stronger gradient clipping
  n_epochs: 4             # Fewer epochs per update
  batch_size: 16          # Smaller batches
  update_interval: 512    # More frequent updates

env:
  num_channels: 5         # Simpler environment
  num_devices: 10
  seq_length: 5
  max_steps: 50
  interference_threshold: 0.5

federated:
  num_clients: 5          # Fewer clients
  num_edge_servers: 1
  clients_per_edge: 5
  num_rounds: 10          # Quick test
  episodes_per_round: 3
  aggregation_method: 'fedavg'

benchmark:
  num_trials: 1
  eval_episodes: 5
  save_every_n_rounds: 5
  metrics_interval: 1

device: 'cpu'
seed: 42
save_interval: 5
eval_interval: 5
log_interval: 1
checkpoint_dir: 'checkpoints_stable'
log_dir: 'logs_stable'
results_dir: 'results_stable'
