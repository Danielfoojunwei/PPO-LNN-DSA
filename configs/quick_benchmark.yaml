# Quick Benchmark Configuration (for testing)

model:
  hidden_dim: 128          # Reduced for speed
  num_lfm_layers: 1
  num_lstm_layers: 1
  num_heads: 4
  use_moe: false

ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  n_epochs: 5              # Reduced
  batch_size: 32           # Reduced
  update_interval: 1024    # Reduced

env:
  num_channels: 10
  num_devices: 20
  seq_length: 10
  max_steps: 100
  interference_threshold: 0.5

federated:
  num_clients: 10          # Reduced
  num_edge_servers: 2      # Reduced
  clients_per_edge: 5
  num_rounds: 20           # Reduced
  episodes_per_round: 5    # Reduced
  aggregation_method: 'fedavg'

benchmark:
  num_trials: 1
  eval_episodes: 10        # Reduced
  save_every_n_rounds: 5
  metrics_interval: 1

device: 'auto'
seed: 42
save_interval: 10
eval_interval: 5
log_interval: 1
checkpoint_dir: 'checkpoints_quick'
log_dir: 'logs_quick'
results_dir: 'results_quick'
